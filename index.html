<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Contador de calorías con IA: escanea tus platos, controla tus macros y sigue tu evolución." />
    <meta name="theme-color" content="#f6f5f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MealScan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MealScan AI · Contador de calorías</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo claro/oscuro
      (function () {
        try {
          var pref = localStorage.getItem('theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
